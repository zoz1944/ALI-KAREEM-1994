<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلبيات المندوب</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f5;--card:#fff;--tx:#14211d;--mut:#667570;--bd:#d9e2df;--pri:#0f766e;--pt:#fff;--dng:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--card:#18231f;--tx:#e8f0ed;--mut:#93a39d;--bd:#2a3a35;--pri:#2bb3a5;--pt:#06201c;--dng:#ff7b6b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.pri{background:var(--pri);color:var(--pt);font-weight:700}
.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.dng{background:transparent;color:var(--dng);border:1px solid var(--dng)}
.big{width:100%;padding:18px;font-size:19px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .qty{width:72px;flex:none}
.x{flex:none;width:40px;padding:10px 0;background:transparent;color:var(--dng);border:1px solid var(--bd)}
.rel{position:relative;flex:1}
.sug{position:absolute;inset-inline:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:2px;box-shadow:0 6px 18px #0003;max-height:180px;overflow:auto}
.sug div{padding:10px 12px;border-bottom:1px solid var(--bd)}
.sug div:last-child{border:0}
.sug div:hover{background:var(--bg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .full{grid-column:1/-1}
.wa{background:#25d366;color:#04230f;font-weight:700}
.tg{background:#229ed9;color:#fff;font-weight:700}
#prev{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.mut{color:var(--mut);font-size:14px}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .btns{display:flex;gap:6px}
.ord button{padding:8px 10px;font-size:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
.hide{display:none}
.opt{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:400}
.opt input{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:7px 12px}
.chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
#emOpts{margin-top:10px}
.emr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.emr>div{display:flex;gap:4px}
.emr .chip{padding:5px 8px}
.pv{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;font-size:15px}
.menu{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:16px;margin-bottom:10px;font-size:17px}
.fr{margin-bottom:14px}
.sig{text-align:center;color:var(--mut);font-size:14px;margin:18px 0 8px}
.sig a{color:var(--pri);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <div class="top"><h1>📦 طلبيات المندوب</h1><button class="sec" onclick="go('sMenu')">⚙️ الإعدادات</button></div>
  <button class="pri big" onclick="newOrder()">➕ إنشاء أوردر جديد</button>
  <div class="card">
    <div class="top"><b>الطلبيات المحفوظة</b><span class="mut" id="cnt"></span></div>
    <div id="list" style="margin-top:10px"></div>
  </div>
</div>

<div id="form" class="hide">
  <div class="top"><h1>أوردر جديد</h1><button class="sec" onclick="goHome()">رجوع</button></div>

  <div class="card">
    <label>اسم الصيدلية</label>
    <div class="rel"><input id="pharm" placeholder="اكتب أول 3 أحرف للاقتراح" autocomplete="off"></div>
  </div>

  <div class="card">
    <label>المذخر</label>
    <div id="dists"></div>
    <button class="sec" onclick="addDist()">+ إضافة مذخر</button>
  </div>

  <div class="card">
    <label>المواد</label>
    <div id="items"></div>
    <div id="addBtns" class="chips"></div>
  </div>

  <div class="card">
    <label>بالتعاون مع (اختياري)</label>
    <input id="coop" placeholder="اكتب الاسم إن وجد">
    <label style="margin-top:12px">ملاحظة (اختياري)</label>
    <textarea id="note" rows="2"></textarea>
  </div>

  <div class="card">
    <label>صورة للأوردر (اختياري)</label>
    <input type="file" id="img" accept="image/*" onchange="pickImg(this)">
    <img id="prev" alt="">
    <button class="sec hide" id="ovBtn" style="margin-top:8px" onclick="openEd()">✏️ كتابة النص داخل الصورة</button>
    <button class="dng hide" id="rmImg" style="margin-top:8px" onclick="clearImg()">حذف الصورة</button>
  </div>

  <div class="acts">
    <button class="wa" onclick="sendWA()">إرسال واتساب</button>
    <button class="tg" onclick="sendTG()">إرسال تلجرام</button>
    <button class="pri full" onclick="saveOrder()">💾 حفظ الطلبية</button>
  </div>
</div>
<div id="sMenu" class="hide">
  <div class="top"><h1>⚙️ الإعدادات</h1><button class="sec" onclick="go('home')">رجوع</button></div>
  <button class="menu" onclick="go('sFont')">🔤 تنسيق الخط</button>
  <button class="menu" onclick="go('sNum')">🔢 ترقيم المواد</button>
  <button class="menu" onclick="go('sEmoji')">😀 الإيموجي والتاريخ</button>
  <button class="menu" onclick="go('sComp')">🏭 الشركات</button>
</div>
<div id="sFont" class="hide">
  <div class="top"><h1>تنسيق الخط</h1><button class="sec" onclick="go('sMenu')">رجوع</button></div>
  <div class="card" id="fontOpts"></div>
  <div class="mut" style="margin-bottom:6px">النموذج</div><div class="pv" id="pvF"></div>
</div>
<div id="sNum" class="hide">
  <div class="top"><h1>ترقيم المواد</h1><button class="sec" onclick="go('sMenu')">رجوع</button></div>
  <div class="card"><div id="numOpts" class="chips"></div></div>
  <div class="mut" style="margin-bottom:6px">النموذج</div><div class="pv" id="pvN"></div>
</div>
<div id="sEmoji" class="hide">
  <div class="top"><h1>الإيموجي والتاريخ</h1><button class="sec" onclick="go('sMenu')">رجوع</button></div>
  <div class="card">
    <label class="opt"><input type="checkbox" id="cbEmoji" onchange="setOpt('emoji',this.checked)">إظهار الإيموجي</label>
    <label class="opt"><input type="checkbox" id="cbDate" onchange="setOpt('date',this.checked)">إظهار التاريخ</label>
    <div id="emOpts"></div>
  </div>
  <div class="mut" style="margin-bottom:6px">النموذج</div><div class="pv" id="pvE"></div>
</div>
<div id="sComp" class="hide">
  <div class="top"><h1>الشركات</h1><button class="sec" onclick="go('sMenu')">رجوع</button></div>
  <div class="card">
    <div class="row"><input id="compIn" placeholder="اسم الشركة"><button class="pri" onclick="addComp()">إضافة</button></div>
    <div id="compList" class="chips"></div>
  </div>
</div>
</div>
<div class="sig">علي كريم : <a href="tel:07831698069" dir="ltr">07831698069</a></div>
<div id="ed" class="hide" style="position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px))">
 <div style="max-width:560px;margin:0 auto">
  <div class="top" style="margin-bottom:10px"><b>النص داخل الصورة</b><div><button class="sec" onclick="closeEd()">إلغاء</button> <button class="pri" onclick="applyEd()">تطبيق</button></div></div>
  <canvas id="cv" style="width:100%;border-radius:10px;touch-action:none;background:#000"></canvas>
  <div class="mut" style="margin:6px 0 12px">اسحب النص على الصورة لتحريكه</div>
  <label>حجم النص</label><input type="range" id="edSize" min="1.5" max="8" step="0.1" oninput="edChg()">
  <label style="margin-top:12px">النص (قابل للتعديل)</label><textarea id="edText" rows="8" oninput="edChg()"></textarea>
  <label class="opt" style="margin-top:12px"><input type="checkbox" id="edCap" checked>إرسال وصف الطلبية أسفل الصورة أيضاً</label>
  <div class="acts"><button class="sec" onclick="edRegen()">إعادة كتابة النص من الطلبية</button><button class="dng" onclick="removeOv()">إزالة النص من الصورة</button></div>
 </div>
</div>

/* الاقتراحات */
function nz(s){return String(s).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627').replace(/\u0629/g,'\u0647').replace(/\u0649/g,'\u064A').replace(/\s+/g,' ').trim()}
function bg(s){var a={};s=' '+s+' ';for(var i=0;i<s.length-1;i++)a[s.substr(i,2)]=1;return a}
function dice(a,b){var x=bg(a),y=bg(b),n=0,c=0,d=0,k;for(k in x){c++;if(y[k])n++}for(k in y)d++;return 2*n/(c+d||1)}
function rank(list,q){q=nz(q);var tk=q.split(' '),out=[];
  list.forEach(function(it){var n=it.k||(it.k=nz(it.t)),sc;
    if(n.indexOf(q)===0)sc=0;else if(n.indexOf(q)>0)sc=1;
    else if(tk.every(function(t){return n.indexOf(t)>=0}))sc=2;
    else{var d=dice(q,n.substr(0,q.length+2));if(d>=0.5)sc=3+(1-d);else return}
    out.push([sc,it])});
  out.sort(function(a,b){return a[0]-b[0]});return out.slice(0,8).map(function(x){return x[1]})}
function suggest(inp,src,min){
  var box=document.createElement('div');box.className='sug';box.style.display='none';
  inp.parentNode.appendChild(box);
  inp.addEventListener('input',function(){
    var q=inp.value.trim();box.innerHTML='';
    if(q.length<min){box.style.display='none';return}
    var m=rank(src(),q);
    if(!m.length){box.style.display='none';return}
    m.forEach(function(it){var s=it.c?it.t+' -'+it.c:it.t;var d=document.createElement('div');d.textContent=it.t;if(it.c){var sp=document.createElement('span');sp.className='mut';sp.textContent=' \u2014 '+it.c;d.appendChild(sp)}
      d.addEventListener('mousedown',function(e){e.preventDefault();inp.value=s;box.style.display='none'});
      d.addEventListener('touchstart',function(e){e.preventDefault();inp.value=s;box.style.display='none'},{passive:false});
      box.appendChild(d)});
    box.style.display='block';
  });
  inp.addEventListener('blur',function(){setTimeout(function(){box.style.display='none'},150)});
}
function remember(key,val){val=val.trim();if(!val)return;var l=load(key,[]);

function pickImg(f){var file=f.files[0];if(!file)return;var rd=new FileReader();

    var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');

var STY={bold:['عريض','*','font-weight:700'],italic:['مائل','_','font-style:italic'],strike:['يتوسطه خط','~','text-decoration:line-through'],mono:['خط ثابت','```','font-family:monospace'],none:['عادي','','']};
var NUM={num:'1.',enum:'1️⃣',dot:'•',check:'✅',blue:'🔹',pill:'💊',star:'⭐'};
function numStr(k,i){if(k=='num')return (i+1)+'. ';if(k=='enum')return String(i+1).split('').map(function(d){return d+'\uFE0F\u20E3'}).join('')+' ';return NUM[k]+' '}
var EMO={pharm:['الصيدلية',['🏥','💊','🏪','⚕️']],dist:['المذخر',['🏢','🚚','🏭','📍']],items:['المواد',['📦','💊','📋','🛍️']],note:['الملاحظة',['📝','💬','⚠️','📌']],coop:['بالتعاون مع',['🤝','👥','🔗','✍️']],date:['التاريخ',['📅','🕒','🗓️','⏰']]};

function qs(x){var q=parseFloat(x.q),p=parseFloat(x.b);if(q>0&&p>0){var e=Math.floor(q*p/100);if(e>0)return '\u202A'+x.q+' +'+e+'\u202C'}return x.q}
function text(o,h,pl){var S=getSt();if(pl)for(var k in S.sty)S.sty[k]='none';
  function b(s,p){var z=S.sty[p||'pharm'],m=STY[z][1];if(!m)return s;if(h){var g={bold:'b',italic:'i',strike:'s',mono:'code'}[z];return '<'+g+'>'+s+'</'+g+'>'}return m+s+m}
  function e(k){return S.emoji&&S.em[k]?S.em[k]+' ':''}
  var t=e('pharm')+b('الصيدلية: '+o.pharm,'pharm')+'\n';
  if(o.dists.length)t+=e('dist')+b('المذخر: '+o.dists.join('، '),'dist')+'\n';
  t+='\n'+e('items')+b('المواد:','items')+'\n';o.items.forEach(function(x,i){t+=numStr(S.num,i)+b(x.n+(x.q?' - عدد: '+qs(x):''),'items')+'\n'});
  if(o.coop)t+='\n'+e('coop')+b('بالتعاون مع: '+o.coop,'note')+'\n';
  if(o.note)t+='\n'+e('note')+b('ملاحظة: '+o.note,'note')+'\n';
  if(S.date)t+='\n'+e('date')+new Date(o.date).toLocaleString('ar-IQ');
  return t}
function persist(o){var l=load('orders',[]);l=l.filter(function(x){return x.id!==o.id});l.unshift(o);
  try{localStorage.setItem('orders',JSON.stringify(l))}catch(e){l.forEach(function(x,i){if(i>0)x.img=''});try{localStorage.setItem('orders',JSON.stringify(l))}catch(e2){toast('المساحة ممتلئة، احذف طلبيات قديمة')}}cur=o}

function share(o,app){
  if(!valid(o))return;learn(o);persist(o);toast('تم حفظ الطلبية تلقائياً ✅');var t=text(o);
  var plain=text(o,false,true);var imgOut=composed(o),cap=!(o.ov&&o.ov.cap===false);
  if(o.img&&navigator.canShare){
    var f=dataToFile(imgOut);
    if(navigator.canShare({files:[f]})){
      navigator.share(app=='wa'&&cap?{files:[f],text:t}:{files:[f]}).then(function(){if(app=='wa'||!cap)toast('اختر '+(app=='wa'?'واتساب':'تلجرام')+' من القائمة');else showStep2(plain)}).catch(function(){});
      return}}
  if(o.img){var a=document.createElement('a');a.href=imgOut;a.download='order.jpg';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل الصورة، أرفقها يدوياً في المحادثة')}
  var u;
  if(app=='wa'){u='https://wa.me/?text='+encodeURIComponent(t)}
  else u='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(plain);
  window.open(u,'_blank')}
var baseImg=null,OV=null,ED=null;
function loadBase(){baseImg=null;if(!imgData)return;var im=new Image();im.onload=function(){baseImg=im};im.src=imgData}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawOv(c,W,H,ov){if(!ov||!ov.text||!ov.text.trim())return;
  var fs=Math.round(W*ov.size/100);c.font='bold '+fs+'px "Segoe UI",Tahoma,Arial,sans-serif';c.direction='rtl';c.textAlign='right';c.textBaseline='top';
  var maxW=W*0.92-fs*1.2,lines=[];
  ov.text.split('\n').forEach(function(p){if(!p.trim()){lines.push('');return}var cur='';p.split(' ').forEach(function(x){var t=cur?cur+' '+x:x;if(cur&&c.measureText(t).width>maxW){lines.push(cur);cur=x}else cur=t});lines.push(cur)});
  var lh=fs*1.35,bw=0;lines.forEach(function(l){bw=Math.max(bw,c.measureText(l).width)});
  var pad=fs*0.6,BW=bw+pad*2,BH=lines.length*lh+pad*2;
  var bx=Math.max(0,Math.min(W-BW,ov.x*W-BW/2)),by=Math.max(0,Math.min(H-BH,ov.y*H-BH/2));
  c.fillStyle='rgba(255,255,255,0.85)';rrect(c,bx,by,BW,BH,fs*0.5);c.fill();
  c.fillStyle='#111';lines.forEach(function(l,i){c.fillText(l,bx+BW-pad,by+pad+i*lh)})}
function composed(o){if(!o.img)return '';if(!o.ov||!baseImg)return o.img;
  var c=document.createElement('canvas');c.width=baseImg.naturalWidth;c.height=baseImg.naturalHeight;var x=c.getContext('2d');x.drawImage(baseImg,0,0);
  var ov=JSON.parse(JSON.stringify(o.ov));if(ov.text===ov.gen)ov.text=text(o,false,true);
  drawOv(x,c.width,c.height,ov);return c.toDataURL('image/jpeg',0.88)}

  var g=text(collect(),false,true);ED=OV?JSON.parse(JSON.stringify(OV)):{text:g,gen:g,size:3.2,x:.5,y:.5,cap:true};
  if(ED.text===ED.gen){ED.text=g;ED.gen=g}
  $('edText').value=ED.text;$('edSize').value=ED.size;$('edCap').checked=ED.cap!==false;
  $('ed').classList.remove('hide');drawEd()}
function drawEd(){var c=$('cv');c.width=baseImg.naturalWidth;c.height=baseImg.naturalHeight;var x=c.getContext('2d');x.drawImage(baseImg,0,0);drawOv(x,c.width,c.height,ED)}
