<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلبيات المندوب</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f5;--card:#fff;--tx:#14211d;--mut:#667570;--bd:#d9e2df;--pri:#0f766e;--pt:#fff;--dng:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--card:#18231f;--tx:#e8f0ed;--mut:#93a39d;--bd:#2a3a35;--pri:#2bb3a5;--pt:#06201c;--dng:#ff7b6b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px}
.pri{background:var(--pri);color:var(--pt);font-weight:700}
.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.dng{background:transparent;color:var(--dng);border:1px solid var(--dng)}
.big{width:100%;padding:18px;font-size:19px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row .qty{width:72px;flex:none}
.x{flex:none;width:40px;padding:10px 0;background:transparent;color:var(--dng);border:1px solid var(--bd)}
.rel{position:relative;flex:1}
.sug{position:absolute;inset-inline:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:2px;box-shadow:0 6px 18px #0003;max-height:180px;overflow:auto}
.sug div{padding:10px 12px;border-bottom:1px solid var(--bd)}
.sug div:last-child{border:0}
.sug div:hover{background:var(--bg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .full{grid-column:1/-1}
.wa{background:#25d366;color:#04230f;font-weight:700}
.tg{background:#229ed9;color:#fff;font-weight:700}
#prev{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.mut{color:var(--mut);font-size:14px}
.ord{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .btns{display:flex;gap:6px}
.ord button{padding:8px 10px;font-size:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
.hide{display:none}
.opt{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:400}
.opt input{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:7px 12px}
.chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
#emOpts{margin-top:10px}
.emr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.emr>div{display:flex;gap:4px}
.emr .chip{padding:5px 8px}
.pv{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;font-size:15px}
.sig{text-align:center;color:var(--mut);font-size:14px;margin:18px 0 8px}
.sig a{color:var(--pri);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <div class="top"><h1>📦 طلبيات المندوب</h1><button class="sec" onclick="toggleSet()">⚙️ الإعدادات</button></div>
  <div class="card hide" id="set">
    <b>إعدادات رسالة الإرسال</b>
    <div style="margin-top:12px">
      <div class="mut" style="margin-bottom:6px">تنسيق الخط</div><div id="styleOpts" class="chips" style="margin-bottom:14px"></div>
      <label class="opt"><input type="checkbox" id="sEmoji" onchange="setOpt('emoji',this.checked)">إظهار الإيموجي</label>
      <label class="opt"><input type="checkbox" id="sDate" onchange="setOpt('date',this.checked)">إظهار التاريخ</label>
      <div class="mut" style="margin:4px 0 6px">ترقيم المواد</div><div id="numOpts" class="chips" style="margin-bottom:14px"></div>
      <div id="emOpts"></div>
      <div class="mut" style="margin:12px 0 6px">النموذج</div>
      <div id="pv" class="pv"></div>
      <div class="mut" style="margin:16px 0 6px">الشركات</div>
      <div class="row"><input id="compIn" placeholder="اسم الشركة"><button class="pri" onclick="addComp()">إضافة</button></div>
      <div id="compList" class="chips"></div>
    </div>
  </div>
  <button class="pri big" onclick="newOrder()">➕ إنشاء أوردر جديد</button>
  <div class="card">
    <div class="top"><b>الطلبيات المحفوظة</b><span class="mut" id="cnt"></span></div>
    <div id="list" style="margin-top:10px"></div>
  </div>
</div>

<div id="form" class="hide">
  <div class="top"><h1>أوردر جديد</h1><button class="sec" onclick="goHome()">رجوع</button></div>

  <div class="card">
    <label>اسم الصيدلية</label>
    <div class="rel"><input id="pharm" placeholder="اكتب أول 3 أحرف للاقتراح" autocomplete="off"></div>
  </div>

  <div class="card">
    <label>المذخر</label>
    <div id="dists"></div>
    <button class="sec" onclick="addDist()">+ إضافة مذخر</button>
  </div>

  <div class="card">
    <label>المواد</label>
    <div id="items"></div>
    <div id="addBtns" class="chips"></div>
  </div>

  <div class="card">
    <label>ملاحظة (اختياري)</label>
    <textarea id="note" rows="2"></textarea>
  </div>

  <div class="card">
    <label>صورة للأوردر (اختياري)</label>
    <input type="file" id="img" accept="image/*" onchange="pickImg(this)">
    <img id="prev" alt="">
    <button class="dng hide" id="rmImg" style="margin-top:8px" onclick="clearImg()">حذف الصورة</button>
  </div>

  <div class="acts">
    <button class="wa" onclick="sendWA()">إرسال واتساب</button>
    <button class="tg" onclick="sendTG()">إرسال تلجرام</button>
    <button class="pri full" onclick="saveOrder()">💾 حفظ الطلبية</button>
  </div>
</div>
</div>
<div class="sig">علي كريم : <a href="tel:07831698069" dir="ltr">07831698069</a></div>
<div id="st2" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:8px;align-items:center"><span style="flex:1">الخطوة 2: أرسل النص تحت الصورة (نفس المحادثة)</span><button class="tg" id="st2b">إرسال النص</button><button class="x" onclick="$('st2').style.display='none'">✕</button></div>
<div id="toast"></div>

<script>
var cur=null, imgData='';
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function $(i){return document.getElementById(i)}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2600)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* الاقتراحات */
function suggest(inp,key,min){
  var box=document.createElement('div');box.className='sug';box.style.display='none';
  inp.parentNode.appendChild(box);
  inp.addEventListener('input',function(){
    var q=inp.value.trim().toLowerCase();box.innerHTML='';
    if(q.length<min){box.style.display='none';return}
    var m=load(key,[]).filter(function(s){return s.toLowerCase().indexOf(q)===0&&s.toLowerCase()!==q}).slice(0,6);
    if(!m.length){box.style.display='none';return}
    m.forEach(function(s){var d=document.createElement('div');d.textContent=s;
      d.addEventListener('mousedown',function(e){e.preventDefault();inp.value=s;box.style.display='none'});
      d.addEventListener('touchstart',function(e){e.preventDefault();inp.value=s;box.style.display='none'},{passive:false});
      box.appendChild(d)});
    box.style.display='block';
  });
  inp.addEventListener('blur',function(){setTimeout(function(){box.style.display='none'},150)});
}
function remember(key,val){val=val.trim();if(!val)return;var l=load(key,[]);
  if(l.map(function(s){return s.toLowerCase()}).indexOf(val.toLowerCase())<0){l.unshift(val);save(key,l.slice(0,500))}}

/* الصفوف */
function addDist(v){var r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="rel"><input class="dn" placeholder="اسم المذخر" autocomplete="off"></div><button class="x" onclick="rm(this)">✕</button>';
  $('dists').appendChild(r);var i=r.querySelector('input');i.value=v||'';suggest(i,'sug_dist',2)}
function addItem(n,q,bp){var r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="rel"><input class="in" placeholder="اسم المادة (أول حرفين)" autocomplete="off"></div><input class="qty iq" inputmode="numeric" placeholder="العدد"><input class="qty ib" inputmode="decimal" placeholder="بونص %"><button class="x" onclick="rm(this)">✕</button>';
  $('items').appendChild(r);var i=r.querySelector('.in');i.value=n||'';r.querySelector('.iq').value=q||'';r.querySelector('.ib').value=bp||'';suggest(i,'sug_item',2)}
function rm(b){var p=b.parentNode,c=p.parentNode;if(c.children.length>1)p.remove();else p.querySelectorAll('input').forEach(function(i){i.value=''})}

/* الصورة */
function pickImg(f){var file=f.files[0];if(!file)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    imgData=c.toDataURL('image/jpeg',0.8);showImg()};im.src=rd.result};rd.readAsDataURL(file)}
function showImg(){var p=$('prev');if(imgData){p.src=imgData;p.style.display='block';$('rmImg').classList.remove('hide')}else{p.style.display='none';$('rmImg').classList.add('hide')}}
function clearImg(){imgData='';$('img').value='';showImg()}
function dataToFile(d){var a=d.split(','),b=atob(a[1]),n=b.length,u=new Uint8Array(n);while(n--)u[n]=b.charCodeAt(n);return new File([u],'order.jpg',{type:'image/jpeg'})}

/* الطلبية */
function collect(){
  return{id:cur&&cur.id||Date.now(),date:new Date().toISOString(),pharm:$('pharm').value.trim(),
    dists:[].map.call(document.querySelectorAll('.dn'),function(i){return i.value.trim()}).filter(Boolean),
    items:[].map.call(document.querySelectorAll('#items .row'),function(r){return{n:r.querySelector('.in').value.trim(),q:r.querySelector('.iq').value.trim(),b:r.querySelector('.ib').value.trim()}}).filter(function(x){return x.n}),
    note:$('note').value.trim(),img:imgData}}
function valid(o){if(!o.pharm){toast('اكتب اسم الصيدلية');return false}if(!o.items.length){toast('أضف مادة واحدة على الأقل');return false}return true}
function learn(o){remember('sug_pharm',o.pharm);o.dists.forEach(function(d){remember('sug_dist',d)});o.items.forEach(function(i){remember('sug_item',i.n)})}
var STY={bold:['عريض','*','font-weight:700'],italic:['مائل','_','font-style:italic'],strike:['يتوسطه خط','~','text-decoration:line-through'],mono:['خط ثابت','```','font-family:monospace'],none:['عادي','','']};
var NUM={num:'1.',enum:'1️⃣',dot:'•',check:'✅',blue:'🔹',pill:'💊',star:'⭐'};
function numStr(k,i){if(k=='num')return (i+1)+'. ';if(k=='enum')return String(i+1).split('').map(function(d){return d+'\uFE0F\u20E3'}).join('')+' ';return NUM[k]+' '}
var EMO={pharm:['الصيدلية',['🏥','💊','🏪','⚕️']],dist:['المذخر',['🏢','🚚','🏭','📍']],items:['المواد',['📦','💊','📋','🛍️']],note:['الملاحظة',['📝','💬','⚠️','📌']],date:['التاريخ',['📅','🕒','🗓️','⏰']]};
function getSt(){var s=load('st',{}),em={};for(var k in EMO)em[k]=(s.em&&s.em[k])||EMO[k][1][0];return{num:s.num||'num',style:s.style||(s.bold===false?'none':'bold'),emoji:s.emoji!==false,date:s.date!==false,em:em}}
function setOpt(k,v){var s=getSt();s[k]=v;save('st',s);renderSet()}
function setEm(k,v){var s=getSt();s.em[k]=v;save('st',s);renderSet()}
function chip(t,on,fn,sty){var b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=t;if(sty)b.style.cssText=sty;b.onclick=fn;return b}
function renderSet(){var s=getSt();$('sEmoji').checked=s.emoji;$('sDate').checked=s.date;
  var so=$('styleOpts');so.innerHTML='';Object.keys(STY).forEach(function(k){so.appendChild(chip(STY[k][0],s.style==k,function(){setOpt('style',k)},STY[k][2]))});
  var no=$('numOpts');no.innerHTML='';Object.keys(NUM).forEach(function(k){no.appendChild(chip(k=='enum'?'1️⃣ 2️⃣ 3️⃣':k=='num'?'1. 2. 3.':NUM[k]+' '+NUM[k]+' '+NUM[k],s.num==k,function(){setOpt('num',k)}))});
  var eo=$('emOpts');eo.innerHTML='';eo.style.display=s.emoji?'block':'none';
  Object.keys(EMO).forEach(function(k){var r=document.createElement('div');r.className='emr';var sp=document.createElement('span');sp.textContent=EMO[k][0];r.appendChild(sp);var d=document.createElement('div');EMO[k][1].forEach(function(x){d.appendChild(chip(x,s.em[k]==x,function(){setEm(k,x)}))});r.appendChild(d);eo.appendChild(r)});
  $('pv').innerHTML=text({pharm:'صيدلية الأمل',dists:['مذخر النور'],items:[{n:'باراسيتامول 500',q:'10',b:'30'},{n:'أموكسيسيلين',q:'5'}],note:'توصيل صباحاً',date:new Date().toISOString()},true)}
function toggleSet(){$('set').classList.toggle('hide')}
function qs(x){var q=parseFloat(x.q),p=parseFloat(x.b);if(q>0&&p>0){var e=Math.floor(q*p/100);if(e>0)return '\u202A'+x.q+' +'+e+'\u202C'}return x.q}
function text(o,h,pl){var S=getSt();if(pl)S.style='none';
  function b(s){var m=STY[S.style][1];if(!m)return s;if(h){var g={bold:'b',italic:'i',strike:'s',mono:'code'}[S.style];return '<'+g+'>'+s+'</'+g+'>'}return m+s+m}
  function e(k){return S.emoji?S.em[k]+' ':''}
  var t=e('pharm')+b('الصيدلية:')+' '+o.pharm+'\n';
  if(o.dists.length)t+=e('dist')+b('المذخر:')+' '+o.dists.join('، ')+'\n';
  t+='\n'+e('items')+b('المواد:')+'\n';o.items.forEach(function(x,i){t+=numStr(S.num,i)+x.n+(x.q?' — العدد: '+qs(x):'')+'\n'});
  if(o.note)t+='\n'+e('note')+b('ملاحظة:')+' '+o.note+'\n';
  if(S.date)t+='\n'+e('date')+new Date(o.date).toLocaleString('ar-IQ');
  return t}
function persist(o){var l=load('orders',[]);l=l.filter(function(x){return x.id!==o.id});l.unshift(o);
  try{localStorage.setItem('orders',JSON.stringify(l))}catch(e){toast('المساحة ممتلئة، احذف طلبيات قديمة')}cur=o}
function saveOrder(){var o=collect();if(!valid(o))return;learn(o);persist(o);toast('تم حفظ الطلبية ✅');goHome()}

function share(o,app){
  if(!valid(o))return;learn(o);persist(o);var t=text(o);
  var plain=text(o,false,true);
  if(o.img&&navigator.canShare){
    var f=dataToFile(o.img);
    if(navigator.canShare({files:[f]})){
      navigator.share(app=='wa'?{files:[f],text:t}:{files:[f]}).then(function(){if(app=='wa')toast('اختر واتساب من القائمة');else showStep2(plain)}).catch(function(){});
      return}}
  if(o.img){var a=document.createElement('a');a.href=o.img;a.download='order.jpg';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل الصورة، أرفقها يدوياً في المحادثة')}
  var u;
  if(app=='wa'){u='https://wa.me/?text='+encodeURIComponent(t)}
  else u='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(plain);
  window.open(u,'_blank')}
function showStep2(txt){$('st2').style.display='flex';$('st2b').onclick=function(){$('st2').style.display='none';if(navigator.share)navigator.share({text:txt}).catch(function(){});else window.open('https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(txt),'_blank')}}
function getComps(){return load('comps',[])}
function addComp(){var v=$('compIn').value.trim();if(!v)return;var l=getComps();if(l.indexOf(v)<0){l.push(v);save('comps',l)}$('compIn').value='';renderComps()}
function delComp(i){var l=getComps();l.splice(i,1);save('comps',l);renderComps()}
function renderComps(){var l=getComps(),cl=$('compList'),ab=$('addBtns');cl.innerHTML='';ab.innerHTML='';
  l.forEach(function(c,i){cl.appendChild(chip(c+' ✕',false,function(){delComp(i)}))});
  function big(t,fn){var b=chip(t,false,fn);b.className='sec';b.style.padding='10px 16px';ab.appendChild(b)}
  if(!l.length)big('+ إضافة مادة',function(){addItem()});
  else l.forEach(function(c){big(c,function(){compItem(c)})})}
function compItem(c){var rows=document.querySelectorAll('#items .row'),inp=rows[rows.length-1].querySelector('.in'),v=inp.value.trim();if(!v){toast('اكتب اسم المادة أولاً');return}inp.value=v+' -'+c;addItem();var n=document.querySelectorAll('#items .in');n[n.length-1].focus()}
function sendWA(){share(collect(),'wa')}
function sendTG(){share(collect(),'tg')}

/* الواجهة */
function reset(){$('pharm').value='';$('note').value='';$('dists').innerHTML='';$('items').innerHTML='';clearImg()}
function newOrder(){cur=null;reset();addDist();addItem();$('home').classList.add('hide');$('form').classList.remove('hide');window.scrollTo(0,0)}
function openOrder(id){var o=load('orders',[]).filter(function(x){return x.id===id})[0];if(!o)return;
  cur=o;reset();$('pharm').value=o.pharm;$('note').value=o.note||'';
  (o.dists.length?o.dists:['']).forEach(addDist);o.items.forEach(function(i){addItem(i.n,i.q,i.b)});imgData=o.img||'';showImg();
  $('home').classList.add('hide');$('form').classList.remove('hide');window.scrollTo(0,0)}
function delOrder(id){if(!confirm('حذف هذه الطلبية؟'))return;save('orders',load('orders',[]).filter(function(x){return x.id!==id}));renderList()}
function goHome(){$('form').classList.add('hide');$('home').classList.remove('hide');renderList()}
function renderList(){var l=load('orders',[]);$('cnt').textContent=l.length?l.length+' طلبية':'';
  $('list').innerHTML=l.length?l.map(function(o){return'<div class="card ord" style="margin-bottom:8px"><div><b>'+esc(o.pharm)+'</b><div class="mut">'+o.items.length+' مادة · '+new Date(o.date).toLocaleDateString('ar-IQ')+'</div></div><div class="btns"><button class="sec" onclick="openOrder('+o.id+')">فتح</button><button class="dng" onclick="delOrder('+o.id+')">حذف</button></div></div>'}).join(''):'<div class="mut">لا توجد طلبيات محفوظة بعد.</div>'}

suggest($('pharm'),'sug_pharm',3);
renderSet();
renderComps();
renderList();
</script>
</body>
</html>
